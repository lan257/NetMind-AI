tools:
  - tool_id: node_by_map
    tool_name: 查询导图下节点
    description: 根据导图 ID 查询该导图下的所有节点
    trigger: 当需要获取某个思维导图的所有节点时使用
    params:
      mapId: long
      netmind_api_base_url: string|null
      timeout_seconds: number|null
    param_descriptions:
      mapId: 导图 ID
      netmind_api_base_url: NetMind API 基础地址，例如 http://127.0.0.1:5120
      timeout_seconds: HTTP 请求超时时间（秒）
    permission_level: none
    permission_message: 是否允许查询导图 {mapId} 下的节点
    script_path: .tool/tools/node_by_map/run.py
    category: netmind
    tags: nodes, query, mindmap
  - tool_id: node_create
    tool_name: 创建节点
    description: 在导图中创建节点
    trigger: 当需要在思维导图中创建新节点时使用
    params:
      mapId: number
      parentId: number
      title: string
      content: string
      orderNo: number
      positionX: number
      positionY: number
    param_descriptions:
      mapId: 所属导图 ID
      parentId: 父节点 ID
      title: 节点标题
      content: 节点内容
      orderNo: 同级排序号
      positionX: 画布 X 坐标，默认为null，不需要填充
      positionY: 画布 Y 坐标，默认为null，不需要填充
    permission_level: confirm
    permission_message: 是否允许创建节点 (标题: {title})
    script_path: .tool/tools/node_create/run.py
    category: netmind
    tags: node, create, add, mindmap
  - tool_id: node_get
    tool_name: 查询单个节点
    description: 按ID查询节点
    trigger: 当需要根据节点ID查询单个节点详情时使用
    params:
      id: number
    param_descriptions:
      id: 节点 ID
    permission_level: none
    permission_message: 是否允许查询节点 {id}
    script_path: .tool/tools/node_get/run.py
    category: netmind
    tags: node, get, query, mindmap
  - tool_id: node_delete_subtree
    tool_name: 删除节点子树
    description: 删除指定节点及其子孙节点
    trigger: 当需要删除节点及其所有子节点时使用
    params:
      id: number
    param_descriptions:
      id: 节点 ID
    permission_level: confirm
    permission_message: 是否允许删除节点 {id} 及其子树
    script_path: .tool/tools/node_delete_subtree/run.py
    category: netmind
    tags: node, delete, subtree, cascade, mindmap
  - tool_id: node_list_by_map
    tool_name: 查询导图下节点
    description: 查询某个导图下的所有节点
    trigger: 当需要查询某个思维导图中的所有节点时使用
    params:
      mapId: number
    param_descriptions:
      mapId: 导图 ID
    permission_level: none
    permission_message: 是否允许查询导图 {mapId} 下的节点
    script_path: .tool/tools/node_list_by_map/run.py
    category: netmind
    tags: node, list, query, mindmap
  - tool_id: node_search
    tool_name: 搜索节点
    description: 按关键词搜索节点，可限定导图范围
    trigger: 当需要按关键词搜索思维导图中的节点时使用
    params:
      mapId: number
      keyword: string
      limit: number
    param_descriptions:
      mapId: 导图 ID，为空则搜索全部导图
      keyword: 搜索关键词
      limit: 返回节点数量上限
    permission_level: none
    permission_message: 是否允许搜索节点 (关键词: {keyword})
    script_path: .tool/tools/node_search/run.py
    category: netmind
    tags: node, search, keyword, mindmap
  - tool_id: node_update
    tool_name: 更新节点
    description: 全量更新思维导图中指定节点的属性，支持修改父节点、标题、内容、排序号、画布坐标。
    trigger: 当需要更新思维导图节点信息时使用，例如修改节点标题或内容，需要先使用tool查询节点的内容，所有参数都需要填充。
    params:
      node_id: long
      parentId: long/null
      title: string
      content: string/null
      orderNo: int
      positionX: double/null
      positionY: double/null
    param_descriptions:
      node_id: 要更新的节点 ID
      parentId: 新的父节点 ID
      title: 节点标题
      content: 节点内容
      orderNo: 同级排序号
      positionX: 画布 X 坐标
      positionY: 画布 Y 坐标
    permission_level: confirm
    permission_message: 是否允许更新节点 {node_id}？
    script_path: .tool/tools/node_update/run.py
    category: netmind
    tags: node, update
  - tool_id: mind_map_cascade_delete
    tool_name: 级联删除导图
    description: 删除导图并级联删除相关节点与关系
    trigger: 当需要删除思维导图及其所有节点和关系时使用
    params:
      id: long
    param_descriptions:
      id: 导图 ID
    permission_level: confirm
    permission_message: 是否允许级联删除导图？ID={id}
    script_path: .tool/tools/mind_map_cascade_delete/run.py
    category: netmind
    tags: mindmap, delete, cascade
  - tool_id: mind_map_delete
    tool_name: 删除导图
    description: 删除单个思维导图，不级联删除关联节点
    trigger: 当需要删除一个思维导图且不删除其节点时使用
    params:
      id: long
    param_descriptions:
      id: 导图 ID
    permission_level: confirm
    permission_message: 是否允许删除导图？ID={id}
    script_path: .tool/tools/mind_map_delete/run.py
    category: netmind
    tags: mindmap, delete
  - tool_id: mind_map_get
    tool_name: 查询单个导图
    description: 按 ID 查询单个思维导图的详细信息
    trigger: 当需要根据导图ID获取单个思维导图的详细信息时使用
    params:
      id: long
    param_descriptions:
      id: 导图 ID
    permission_level: none
    permission_message: 是否允许查询导图详情？参数：id={id}
    script_path: .tool/tools/mind_map_get/run.py
    category: netmind
    tags: mindmap, get, detail
  - tool_id: mind_map_list
    tool_name: 查询导图列表
    description: 查询全部思维导图列表
    trigger: 当需要获取所有思维导图的列表信息时使用
    params:
    permission_level: none
    permission_message: 是否允许查询导图列表
    script_path: .tool/tools/mind_map_list/run.py
    category: netmind
    tags: mindmap, list
  - tool_id: mind_map_update
    tool_name: 更新导图
    description: 更新导图标题或根节点
    trigger: 当需要修改思维导图的标题或根节点时使用
    params:
      id: long
      title: string
      rootNodeId: long
    param_descriptions:
      id: 导图 ID
      title: 新标题（至少提供一个更新字段）
      rootNodeId: 新根节点 ID（传 null 可清除）
    permission_level: none
    permission_message: 是否允许更新导图？ID={id}, 标题={title}
    script_path: .tool/tools/mind_map_update/run.py
    category: netmind
    tags: mindmap, update
  - tool_id: node_relation_create
    tool_name: 创建关系
    description: 创建节点之间的关联
    trigger: 当需要创建两个节点之间的关联关系时使用
    params:
      sourceId: number
      targetId: number
      relationType: string
      weight: number
      mapId: number
    param_descriptions:
      sourceId: 起始节点 ID
      targetId: 目标节点 ID
      relationType: 关系类型
      weight: 权重
      mapId: 所属导图 ID
    permission_level: confirm
    permission_message: 是否允许创建关系 (sourceId: {sourceId}, targetId: {targetId})
    script_path: .tool/tools/node_relation_create/run.py
    category: netmind
    tags: node, relation, create, mindmap
  - tool_id: node_relation_delete
    tool_name: 删除关系
    description: 删除指定节点关系
    trigger: 当需要删除节点之间的关联关系时使用
    params:
      id: number
    param_descriptions:
      id: 关系 ID
    permission_level: confirm
    permission_message: 是否允许删除关系 (id: {id})
    script_path: .tool/tools/node_relation_delete/run.py
    category: netmind
    tags: node, relation, delete, mindmap
  - tool_id: node_relation_delete_by_node
    tool_name: 删除节点相关关系
    description: 删除某节点相关的所有关系
    trigger: 当需要删除某个节点相关的所有关联关系时使用
    params:
      nodeId: number
    param_descriptions:
      nodeId: 节点 ID
    permission_level: confirm
    permission_message: 是否允许删除节点相关关系 (nodeId: {nodeId})
    script_path: .tool/tools/node_relation_delete_by_node/run.py
    category: netmind
    tags: node, relation, delete, mindmap
  - tool_id: node_relation_get
    tool_name: 查询单个关系
    description: 按ID查询节点关系
    trigger: 当需要按ID查询某个节点关系的详细信息时使用
    params:
      id: number
    param_descriptions:
      id: 关系 ID
    permission_level: none
    permission_message: 是否允许查询关系 {id}
    script_path: .tool/tools/node_relation_get/run.py
    category: netmind
    tags: node, relation, get, mindmap
  - tool_id: node_relation_list_by_map
    tool_name: 查询导图下关系
    description: 查询某个导图下的所有节点关系
    trigger: 当需要查询某个思维导图下的所有节点关系时使用
    params:
      mapId: number
    param_descriptions:
      mapId: 导图 ID
    permission_level: none
    permission_message: 是否允许查询导图 {mapId} 下的节点关系
    script_path: .tool/tools/node_relation_list_by_map/run.py
    category: netmind
    tags: node, relation, list, mindmap
  - tool_id: node_relation_list_by_node
    tool_name: 查询节点相关关系
    description: 查询与某节点相关的所有关系
    trigger: 当需要查询某个节点相关的所有关系时使用
    params:
      nodeId: number
    param_descriptions:
      nodeId: 节点 ID
    permission_level: none
    permission_message: 是否允许查询节点 {nodeId} 的相关关系
    script_path: .tool/tools/node_relation_list_by_node/run.py
    category: netmind
    tags: node, relation, list, mindmap
  - tool_id: mind_map_create
    tool_name: 创建导图
    description: 创建新的思维导图
    trigger: 当需要新建一个思维导图时使用
    params:
      title: string
    param_descriptions:
      title: 导图标题
    permission_level: none
    permission_message: 是否允许创建导图？标题：{title}
    script_path: .tool/tools/mind_map_create/run.py
    category: netmind
    tags: mindmap, create
